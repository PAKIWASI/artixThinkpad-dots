# matrix_rain — rainbow theme
#
# Every config key matrix_rain understands, with every value explained.
# Drop this in as-is for the rainbow look, or use it as a reference and
# comment out any line to fall back to its built-in default (defaults are
# noted in each comment).
#
# Install at:  $XDG_CONFIG_HOME/matrix_rain/theme.conf
#   which may be:  ~/.config/matrix_rain/theme.conf
#
# Format: `key = value`. Lines starting with '#' and blank lines are
# ignored. Unknown keys / malformed values are warned about on stderr and
# skipped — the rest of the file still loads.


# --- timing --------------------------------------------------------------

# frames per second. Higher = smoother, more CPU. Values <= 0 fall back to
# the default. Default: 30
fps = 45


# --- color ----------------------------------------------------------------

# leading (brightest) character of every drop — #RRGGBB. Stays a single
# color even in rainbow mode, so there's a consistent bright edge across
# all the shifting trail hues. Default: #F8F8F2
color_head = #F8F8F2

# trail color(s), freshly-lit -> faded — one #RRGGBB, or a comma-separated
# list of up to 8 stops. ONLY MATTERS when color_mode = fixed (below) —
# rainbow mode replaces the trail palette entirely with its own HSV wheel
# and ignores this key while active. Left here (a 6-stop spectrum) so it's
# ready to go if you switch color_mode back to fixed later.
# Default: #50FA7B
# color_trail = #ff79c6, #bd93f9, #50fa7b, #6272a4, #ffb86c, #8be9fd
color_trail = #50FA7B

# how multiple color_trail stops combine. Only matters with more than one
# stop, and only in fixed mode (see color_trail above).
#   per_column — each drop is randomly assigned one whole stop at spawn
#                (a mixed-but-coherent-per-drop palette)
#   gradient   — a single drop interpolates through every stop in
#                sequence as it ages (a true multi-stop gradient)
# Default: per_column
color_mix = gradient
# color_mix = per_column

# fixed  — use color_trail/color_mix as configured above
# rainbow — replace the trail palette with an HSV color wheel: hue shifts
#           across columns and drifts over time. This is what makes this
#           a rainbow theme.
# Default: fixed
color_mode = rainbow
# color_mode = fixed

# age fraction (0-1) of a cell's trail length past which it blanks
# (renders as a space) instead of a dim color. Below this threshold the
# cell lerps from its base color toward a darker version of itself —
# never toward literal black, so the fade stays within the theme's hue
# instead of showing up as a dark blob on a lighter terminal background.
# Lower = trails blank out earlier / look shorter; higher = trails stay
# visibly colored longer before cutting off. Default: 0.85
fade_cutoff = 0.85


# --- drop shape & motion ---------------------------------------------------

# ticks-per-row for the fastest / slowest drops (smaller = faster fall).
# Actual per-drop speed is drawn from a Gaussian centered between these,
# not picked uniformly — most drops fall at a "typical" pace with
# occasional fast/slow outliers. max_speed is clamped to be >= min_speed.
# Defaults: min_speed = 1, max_speed = 4
min_speed = 1
max_speed = 3

# trail length range, in rows. Like speed, the actual length per drop is
# Gaussian-distributed between these, not uniform. trail_max is clamped
# to be >= trail_min. Defaults: trail_min = 4, trail_max = 16
trail_min = 6
trail_max = 22


# --- spawn & glitch behavior ------------------------------------------------

# per-tick probability an idle column starts a new drop (0.0 - 1.0).
# Higher = denser rain. Default: 0.2
spawn_chance = 0.25

# base per-tick probability a lit character rerolls to a different glyph
# (0.0 - 1.0). Columns occasionally roll into a short "burst" where the
# effective chance spikes well above this value, so glitches read as
# bursts of static landing on a drop rather than an even sprinkle.
# Default: 0.3
glitch_chance = 0.3


# --- glyphs -----------------------------------------------------------------

# named glyph preset: katakana | latin | digits | binary | arabic | custom
#   katakana — the classic look: digits + half-width katakana (default)
#   latin    — digits + A-Z
#   digits   — 0-9 only
#   binary   — 0 and 1 only
#   arabic   — standalone/isolated Arabic letterforms (no joined shaping —
#              see README.md for why)
#   custom   — use the `glyphs` key below verbatim
# Default: katakana
charset = latin

# explicit glyph pool as raw UTF-8 text. Only used when charset = custom
# (or the charset key is omitted entirely). Any script works here.
# Ignored above since charset = katakana is set; shown commented out as a
# custom-pool example.
# glyphs = 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
